name: Chess Coach Worker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run one new game or backfill every unanalysed game"
        required: true
        default: "cycle"
        type: choice
        options:
          - cycle
          - backfill

concurrency:
  group: chess-coach-worker
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      CHESSCOM_USERNAME: ${{ secrets.CHESSCOM_USERNAME }}
      CHESSCOM_USER_AGENT: personal-chess-coach/github-actions
      DATA_DIR: ./data
      PERSISTENCE_BACKEND: supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: 1553144226101993562
    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify worker
        run: npm run typecheck

      - name: Run requested coach mode
        env:
          COACH_MODE: ${{ inputs.mode || 'cycle' }}
        run: |
          if [ "$COACH_MODE" = "backfill" ]; then
            npm run analyze-all
          else
            npm run coach-cycle
          fi
